<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title> Notification Email </title>

    <style>
        body {
            margin-top: 15px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        * {
            text-align: center;
        }

        h1 {
            color: blueviolet;
        }

        h2 {
            color: white;
            border-radius: 15px;
            padding: 10px;
        }

        h2 {
            background-color: blueviolet;
            width: 250px;
            margin: 0 auto;
        }

        p {
            color: grey;
            text-decoration: underline;
            margin: 20px auto;
        }
    </style>
</head>

<body>
<h1>TaskGo</h1>
<h2 th:text="${subject}"></h2>
<p th:text="${message}"></p>
</body>
</html>
